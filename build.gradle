plugins {
    id 'base'
}

group = 'top.dreamfall'
version = '1.0.0'

tasks.register('buildAll') {
    group = 'build'
    description = 'Build all NeoForge mod versions'
    dependsOn gradle.includedBuild('1.21').task(':build')
    dependsOn gradle.includedBuild('1.21.1').task(':build')
    dependsOn gradle.includedBuild('1.21.2-1.21.3').task(':build')
    dependsOn gradle.includedBuild('1.21.4-1.21.10').task(':build')
    dependsOn gradle.includedBuild('1.21.11').task(':build')
}

tasks.named('build') {
    dependsOn 'buildAll'
}
